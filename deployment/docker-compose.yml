# Local development dependencies for the CompanionOS backend control plane.
# Not needed for the desktop app or Milestone A; brought up from Milestone E.
#
#   docker compose -f deployment/docker-compose.yml up -d
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: companionos
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: companion
      MINIO_ROOT_PASSWORD: companion-dev-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
