# Shared build configuration for CompanionOS.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled: the JavaFX plugin's `run`/JavaExec task reads
# project extensions at execution time, which the config cache cannot serialize
# (it fails when the app exits). Re-enable only if that task becomes CC-compatible.
org.gradle.configuration-cache=false

# Dependency versions (single source of truth).
javafxVersion=21.0.4
jnaVersion=5.14.0
jacksonVersion=2.17.2
junitVersion=5.10.3
assertjVersion=3.26.3
slf4jVersion=2.0.13
logbackVersion=1.5.6
